services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      CONFIG_PATH: /app/config/bot.toml
    volumes:
      - ./data:/data
      - ./config/bot.toml:/app/config/bot.toml:ro
      # Your working copy of this repo, so the admin profile can debug the bot.
      - ./:/srv/claudia/repo
      - ./work:/srv/claudia/work
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - bot
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
