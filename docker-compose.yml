# Deployed with Dokploy. Dokploy routes the domain to `bot:8000` and handles TLS,
# so no reverse proxy is defined here. Set the variables below in Dokploy's
# environment settings (see .env.example).
services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in Dokploy}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set in Dokploy}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in Dokploy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # First boot only: seeds data/bot.toml. After that, edit the file in the claudia_data volume.
      BOT_CONFIG_TOML: ${BOT_CONFIG_TOML:-}
      BOT_CONFIG_RESEED: ${BOT_CONFIG_RESEED:-false}
      DATA_DIR: /data
    volumes:
      - claudia_data:/data
      - claudia_work:/srv/claudia/work
      # Checkout of this repo, so the admin profile can debug the bot.
      - ./:/srv/claudia/repo
    expose:
      - "8000"

volumes:
  claudia_data: {}
  claudia_work: {}
