[project]
name = "claudia-telegram"
version = "0.1.0"
description = "Telegram channel adapter: webhook in, replies and chat actions out."
requires-python = ">=3.12"
dependencies = [
    "claudia-core",
    "claudia-channels",
    "aiogram>=3.31",
    "fastapi>=0.115",
]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-channels = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_telegram"]
