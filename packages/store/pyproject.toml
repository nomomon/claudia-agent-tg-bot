[project]
name = "claudia-store"
version = "0.1.0"
description = "SQLite persistence for principals, profiles, and sessions."
requires-python = ">=3.12"
dependencies = ["claudia-core"]

[tool.uv.sources]
claudia-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_store"]
