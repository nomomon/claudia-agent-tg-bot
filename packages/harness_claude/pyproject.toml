[project]
name = "claudia-harness-claude"
version = "0.1.0"
description = "Claude Code harness adapter (claude-agent-sdk)."
requires-python = ">=3.12"
dependencies = [
    "claudia-core",
    "claudia-harness",
    "claude-agent-sdk>=0.2.172",
]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_harness_claude"]
