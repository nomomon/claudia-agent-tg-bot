[project]
name = "claudia-channels"
version = "0.1.0"
description = "Channel-neutral orchestrator: routing, isolation, commands, turns."
requires-python = ">=3.12"
dependencies = ["claudia-core", "claudia-harness"]

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_channels"]
