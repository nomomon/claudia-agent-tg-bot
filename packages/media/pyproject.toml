[project]
name = "claudia-media"
version = "0.1.0"
description = "Speech-to-text and text-to-speech adapters (OpenAI)."
requires-python = ">=3.12"
dependencies = ["claudia-core", "openai>=1.50"]

[tool.uv.sources]
claudia-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_media"]
