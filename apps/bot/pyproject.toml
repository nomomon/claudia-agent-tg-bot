[project]
name = "claudia-bot"
version = "0.1.0"
description = "Composition root: settings, config loading, webhook server, CLI."
requires-python = ">=3.12"
dependencies = [
    "claudia-core",
    "claudia-harness",
    "claudia-harness-claude",
    "claudia-store",
    "claudia-channels",
    "claudia-telegram",
    "claudia-media",
    "aiogram>=3.31",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "openai>=1.50",
]

[project.scripts]
claudia = "claudia_bot.cli:main"

[tool.uv.sources]
claudia-core = { workspace = true }
claudia-harness = { workspace = true }
claudia-harness-claude = { workspace = true }
claudia-store = { workspace = true }
claudia-channels = { workspace = true }
claudia-telegram = { workspace = true }
claudia-media = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudia_bot"]
